<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <ul>
                <li>Mouse: Move left paddle up/down</li>
                <li>Arrow Keys (↑/↓): Move left paddle up/down</li>
                <li>Right paddle is controlled by the computer</li>
                <li>Press SPACE to start/pause the game</li>
            </ul>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
